<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Fênix - Planner 2026</title>
  
  <!-- Theme & Mobile -->
  <meta name="theme-color" content="#c67b5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fênix 2026">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; color: #3d3d3d; }
    h1,h2,h3,.font-serif { font-family: 'Playfair Display', serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c67b5c; border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div id="root"></div>

  <!-- Botão Instalar PWA -->
  <button id="install-btn" style="position:fixed;bottom:20px;right:20px;background:#c084fc;color:white;padding:.5rem 1rem;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;display:none;z-index:999;">Instalar App</button>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('SW registrado!'))
          .catch(err => console.log('Falha no SW:', err));
      });
    }

    // PWA Install
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      installBtn.style.display = 'none';
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          deferredPrompt = null;
        });
      }
    });
  </script>

  <!-- Seu script principal -->
  <script type="module" src="./script.js"></script>
</body>
</html>
