<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeto Fênix - Planner 2026</title>
<meta name="theme-color" content="#c67b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fênix 2026">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.json">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; color: #3d3d3d; -webkit-tap-highlight-color: transparent; }
h1,h2,h3,.font-serif { font-family: 'Playfair Display', serif; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #f1f1f1; }
::-webkit-scrollbar-thumb { background: #c67b5c; border-radius: 10px; }
#install-btn { position: fixed; bottom: 20px; right: 20px; background: #c084fc; color: white; padding: .5rem 1rem; border-radius: 999px; box-shadow: 0 4px 12px rgba(0,0,0,.2); cursor: pointer; display: none; z-index: 999; }
</style>

<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>

<body>
<div id="root"></div>

<!-- Botão Instalar -->
<button id="install-btn">Instalar App</button>

<script>
let deferredPrompt;

// Captura evento antes da instalação
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const btn = document.getElementById('install-btn');
    btn.style.display = 'block';
    btn.onclick = async () => {
        btn.style.display = 'none';
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Instalação: ', outcome);
        deferredPrompt = null;
    };
});

// Registra Service Worker
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('SW registrado com sucesso'))
        .catch(err => console.log('SW falhou:', err));
    });
}
</script>
</body>
</html>
